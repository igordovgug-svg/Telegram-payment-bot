services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                                          # додано
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:                                                    # додано
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db          # усередині мережі Docker база доступна за іменем сервісу
      POSTGRES_PORT: "5432"      # внутрішній порт, а не 5433 з твого Windows
      API_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy   # чекаємо, поки база реально готова
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata: